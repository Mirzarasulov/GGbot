<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velosher Shop - Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .glass {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 25px;
            margin-bottom: 20px;
        }
        .glass:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: scale(1.05);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 5px;
        }
        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .nav-tabs .nav-link {
            color: #6c757d;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .nav-tabs .nav-link:hover {
            background: #f8f9fa;
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-gradient:hover {
            transform: scale(1.05);
            color: white;
        }
        .badge-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 500;
        }
        .badge-pending { background: #ffc107; color: #000; }
        .badge-paid { background: #28a745; color: #fff; }
        .badge-shipped { background: #17a2b8; color: #fff; }
        .badge-delivered { background: #007bff; color: #fff; }
        .badge-cancelled { background: #dc3545; color: #fff; }
        @media (max-width: 768px) {
            .stat-number { font-size: 2rem; }
            .glass { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="glass">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="mb-0"><i class="fas fa-store" style="color:#667eea;"></i> Velosher Shop</h1>
                    <p class="text-muted mb-0"><i class="fas fa-phone-alt"></i> +998 90 123 45 67</p>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <a href="/admin/" class="btn btn-outline-primary me-2"><i class="fas fa-cog"></i> Админка</a>
                    <a href="/shop/" class="btn btn-gradient"><i class="fas fa-store"></i> Магазин</a>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard">
                    <i class="fas fa-chart-pie"></i> Главная
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders">
                    <i class="fas fa-box"></i> Заказы
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="products-tab" data-bs-toggle="tab" data-bs-target="#products">
                    <i class="fas fa-tag"></i> Товары
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- DASHBOARD -->
            <div class="tab-pane fade show active" id="dashboard">
                <div class="row g-4" id="stats"></div>
                <div class="glass mt-4">
                    <h4><i class="fas fa-clock" style="color:#667eea;"></i> Последние заказы</h4>
                    <div id="ordersList"></div>
                </div>
            </div>

            <!-- ORDERS -->
            <div class="tab-pane fade" id="orders">
                <div class="glass">
                    <h4><i class="fas fa-box" style="color:#667eea;"></i> Все заказы</h4>
                    <div id="allOrdersList"></div>
                </div>
            </div>

            <!-- PRODUCTS -->
            <div class="tab-pane fade" id="products">
                <div class="glass">
                    <h4><i class="fas fa-plus-circle" style="color:#667eea;"></i> Добавить товар</h4>
                    <form id="addProductForm" enctype="multipart/form-data" class="row g-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" id="pName" placeholder="Название" required>
                        </div>
                        <div class="col-md-3">
                            <input type="number" class="form-control" id="pPrice" placeholder="Цена (сум)" required>
                        </div>
                        <div class="col-md-2">
                            <input type="number" class="form-control" id="pStock" placeholder="Кол-во" value="10">
                        </div>
                        <div class="col-md-3">
                            <input type="file" class="form-control" id="pImage" accept="image/*">
                        </div>
                        <div class="col-12">
                            <textarea class="form-control" id="pDesc" placeholder="Описание" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-gradient w-100"><i class="fas fa-plus"></i> Добавить товар</button>
                        </div>
                    </form>
                </div>
                <div class="glass mt-4">
                    <h4><i class="fas fa-list" style="color:#667eea;"></i> Список товаров</h4>
                    <div class="row" id="productsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========== СТАТИСТИКА ==========
        async function loadStats() {
            try {
                const res = await fetch('/api/stats/');
                const data = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-icon">👥</div>
                            <div class="stat-number">${data.users || 0}</div>
                            <div class="stat-label">Пользователи</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-icon">📦</div>
                            <div class="stat-number">${data.orders || 0}</div>
                            <div class="stat-label">Заказы</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-icon">💰</div>
                            <div class="stat-number">${data.revenue_format || data.revenue || 0}</div>
                            <div class="stat-label">Выручка (сум)</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-icon">📈</div>
                            <div class="stat-number">${data.todayOrders || 0}</div>
                            <div class="stat-label">Заказов сегодня</div>
                        </div>
                    </div>
                `;
            } catch(e) {
                console.error('Ошибка:', e);
                document.getElementById('stats').innerHTML = '<div class="col-12 text-center">Ошибка загрузки статистики</div>';
            }
        }

        // ========== ЗАКАЗЫ ==========
        async function loadOrders() {
            try {
                const res = await fetch('/api/orders/');
                const data = await res.json();
                let html = `<table class="table table-striped">
                    <thead><tr><th>Заказ</th><th>Покупатель</th><th>Сумма</th><th>Статус</th><th>Дата</th></tr></thead><tbody>`;
                if (data.orders && data.orders.length > 0) {
                    data.orders.slice(0, 10).forEach(o => {
                        html += `<tr>
                            <td><strong>#${o.order_id}</strong></td>
                            <td>${o.user_name || 'Неизвестно'}</td>
                            <td><strong>${o.total_format || o.total_amount} сум</strong></td>
                            <td><span class="badge-status badge-${o.status}">${o.status_display || o.status}</span></td>
                            <td>${o.created_at}</td>
                        </tr>`;
                    });
                } else {
                    html += `<tr><td colspan="5" class="text-center">Нет заказов</td></tr>`;
                }
                html += '</tbody></table>';
                document.getElementById('ordersList').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        // ========== ВСЕ ЗАКАЗЫ ==========
        async function loadAllOrders() {
            try {
                const res = await fetch('/api/orders/');
                const data = await res.json();
                let html = `<table class="table table-striped">
                    <thead><tr><th>Заказ</th><th>Покупатель</th><th>Телефон</th><th>Сумма</th><th>Статус</th><th>Дата</th></tr></thead><tbody>`;
                if (data.orders && data.orders.length > 0) {
                    data.orders.forEach(o => {
                        html += `<tr>
                            <td><strong>#${o.order_id}</strong></td>
                            <td>${o.user_name || 'Неизвестно'}</td>
                            <td>${o.phone || '-'}</td>
                            <td><strong>${o.total_format || o.total_amount} сум</strong></td>
                            <td><span class="badge-status badge-${o.status}">${o.status_display || o.status}</span></td>
                            <td>${o.created_at}</td>
                        </tr>`;
                    });
                } else {
                    html += `<tr><td colspan="6" class="text-center">Нет заказов</td></tr>`;
                }
                html += '</tbody></table>';
                document.getElementById('allOrdersList').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        // ========== ТОВАРЫ ==========
        async function loadProducts() {
            try {
                const res = await fetch('/api/products/');
                const data = await res.json();
                let html = '';
                if (data.products && data.products.length > 0) {
                    data.products.forEach(p => {
                        html += `
                            <div class="col-md-3 col-6 mb-3">
                                <div class="card h-100">
                                    <img src="${p.image || 'https://via.placeholder.com/300x300/667eea/white?text=🚲'}" class="card-img-top" alt="${p.name}">
                                    <div class="card-body text-center">
                                        <h6 class="card-title">${p.name}</h6>
                                        <p class="card-text"><strong>${p.price_format || p.price} сум</strong></p>
                                        <span class="badge ${p.stock > 0 ? 'bg-success' : 'bg-danger'}">${p.stock > 0 ? '✅ ' + p.stock + ' шт' : '❌ Нет'}</span>
                                        <button class="btn btn-sm btn-danger mt-2 w-100" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i> Удалить</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html = `<div class="col-12 text-center">Товаров пока нет</div>`;
                }
                document.getElementById('productsList').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        // ========== ДОБАВЛЕНИЕ ТОВАРА ==========
        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('pName').value);
            formData.append('description', document.getElementById('pDesc').value);
            formData.append('price', document.getElementById('pPrice').value);
            formData.append('stock', document.getElementById('pStock').value);
            const image = document.getElementById('pImage').files[0];
            if (image) formData.append('image', image);
            
            try {
                const res = await fetch('/api/products/add/', { method: 'POST', body: formData });
                if (res.ok) {
                    alert('✅ Товар добавлен!');
                    this.reset();
                    loadProducts();
                } else {
                    alert('❌ Ошибка добавления');
                }
            } catch(e) { alert('❌ Ошибка'); }
        });

        // ========== УДАЛЕНИЕ ТОВАРА ==========
        async function deleteProduct(id) {
            if (!confirm('Удалить товар?')) return;
            try {
                const res = await fetch(`/api/products/${id}/delete/`, { method: 'DELETE' });
                if (res.ok) {
                    alert('✅ Товар удален');
                    loadProducts();
                }
            } catch(e) { alert('❌ Ошибка'); }
        }

        // ========== ЗАГРУЗКА ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadOrders();
            loadProducts();
            loadAllOrders();

            document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(btn => {
                btn.addEventListener('shown.bs.tab', function(e) {
                    const target = e.target.getAttribute('data-bs-target');
                    if (target === '#orders') loadAllOrders();
                    if (target === '#products') loadProducts();
                    if (target === '#dashboard') { loadStats(); loadOrders(); }
                });
            });

            setInterval(() => { loadStats(); loadOrders(); }, 30000);
        });
    </script>
</body>
</html>
