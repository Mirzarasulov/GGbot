<!DOCTYPE html>
{% load static %}
<html lang="ru" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Оформление заказа - Velosher Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-card: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #6c757d;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-card: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border-color: #2a2a4e;
            --shadow-color: rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-custom .brand {
            color: white;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }
        .navbar-custom .brand i { margin-right: 10px; }
        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 20px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.3);
            color: white;
        }
        .cart-badge {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s;
        }
        .cart-badge:hover { background: rgba(255,255,255,0.3); color: white; }
        .cart-count {
            background: #ff4757;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 5px;
        }
        .theme-toggle {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
        }
        .checkout-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px var(--shadow-color);
            margin-top: 30px;
            border: 1px solid var(--border-color);
        }
        .form-control {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .form-control::placeholder {
            color: var(--text-secondary);
        }
        .order-summary {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .order-total {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        .btn-submit {
            background: linear-gradient(135deg, #00b894 0%, #00a381 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0,184,148,0.4);
            color: white;
        }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer {
            background: #2d3436;
            color: rgba(255,255,255,0.7);
            padding: 40px 0;
            margin-top: 40px;
            text-align: center;
        }
        .success-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .success-modal.show { display: flex; }
        .success-modal .content {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.5s ease;
        }
        .success-modal .content i { font-size: 64px; color: #00b894; margin-bottom: 20px; }
        .success-modal .content h3 { color: var(--text-primary); }
        .success-modal .content p { color: var(--text-secondary); }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .text-muted-custom { color: var(--text-secondary); }
        @media (max-width: 768px) {
            .checkout-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar-custom">
        <div class="container">
            <div class="row w-100 align-items-center">
                <div class="col-4">
                    <a href="/shop/" class="brand"><i class="fas fa-bicycle"></i> Velosher</a>
                </div>
                <div class="col-8 text-end">
                    <button class="theme-toggle me-2" onclick="toggleTheme()">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                    <a href="/cart/" class="cart-badge me-2">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                    <a href="/cart/" class="btn-back"><i class="fas fa-arrow-left"></i> Назад</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="container py-4">
        <div class="row">
            <div class="col-lg-8">
                <div class="checkout-card">
                    <h3 class="mb-4" style="color:var(--text-primary);">
                        <i class="fas fa-pen" style="color:#667eea;"></i> Данные для заказа
                    </h3>
                    
                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label class="form-label" style="color:var(--text-primary);">👤 Ваше имя *</label>
                            <input type="text" class="form-control" id="userName" required placeholder="Иван Иванов">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="color:var(--text-primary);">📱 Телефон *</label>
                            <input type="tel" class="form-control" id="userPhone" required placeholder="+998 90 123 45 67">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="color:var(--text-primary);">📍 Адрес доставки *</label>
                            <textarea class="form-control" id="userAddress" rows="3" required placeholder="г. Ташкент, ул. ..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="color:var(--text-primary);">💬 Комментарий</label>
                            <textarea class="form-control" id="userComment" rows="2" placeholder="Дополнительная информация..."></textarea>
                        </div>
                        
                        <button type="submit" class="btn-submit" id="submitBtn">
                            <i class="fas fa-check"></i> Подтвердить заказ
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="checkout-card">
                    <h4 class="mb-3" style="color:var(--text-primary);">
                        <i class="fas fa-receipt" style="color:#667eea;"></i> Ваш заказ
                    </h4>
                    <div id="orderSummary">
                        <div class="text-center py-4 text-muted-custom">Загрузка...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SUCCESS MODAL -->
    <div class="success-modal" id="successModal">
        <div class="content">
            <i class="fas fa-check-circle"></i>
            <h3>✅ Заказ оформлен!</h3>
            <p id="orderIdText" class="text-muted-custom">Номер заказа: #</p>
            <p class="text-muted-custom">Скоро с вами свяжутся для подтверждения.</p>
            <a href="/shop/" class="btn btn-primary mt-3">Продолжить покупки</a>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <div class="container">
            <p class="mb-0">© 2024 Velosher Shop</p>
        </div>
    </div>

    <script>
        // ========== ТЕМНАЯ ТЕМА ==========
        function toggleTheme() {
            const html = document.getElementById('htmlRoot');
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const icon = document.getElementById('themeIcon');
            icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.getElementById('htmlRoot').setAttribute('data-theme', savedTheme);
        const icon = document.getElementById('themeIcon');
        icon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';

        // ========== ЗАГРУЗКА КОРЗИНЫ ==========
        async function loadCartSummary() {
            try {
                const res = await fetch('/api/cart/');
                const data = await res.json();
                renderSummary(data);
                document.getElementById('cartCount').textContent = data.count || 0;
            } catch(e) {
                document.getElementById('orderSummary').innerHTML = `
                    <div class="text-center py-4 text-danger">Ошибка загрузки</div>
                `;
            }
        }

        function renderSummary(data) {
            const container = document.getElementById('orderSummary');
            if (!data.items || data.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4 text-muted-custom">
                        <i class="fas fa-shopping-bag" style="font-size:32px;"></i>
                        <p class="mt-2">Корзина пуста</p>
                        <a href="/shop/" class="btn btn-sm btn-primary">В магазин</a>
                    </div>
                `;
                document.getElementById('submitBtn').disabled = true;
                return;
            }

            let html = '';
            data.items.forEach(item => {
                html += `
                    <div class="order-item">
                        <span>${item.name} × ${item.quantity}</span>
                        <span>${item.subtotal_format || item.subtotal} сум</span>
                    </div>
                `;
            });
            html += `
                <div class="order-item" style="border-bottom: none; font-weight:700; font-size:18px; border-top:2px solid #667eea; margin-top:10px; padding-top:15px;">
                    <span>Итого</span>
                    <span class="order-total">${data.total_format || data.total} сум</span>
                </div>
            `;

            container.innerHTML = html;
            document.getElementById('submitBtn').disabled = false;
        }

        // ========== ОФОРМЛЕНИЕ ЗАКАЗА ==========
        document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Оформление...';

            const data = {
                user_name: document.getElementById('userName').value,
                phone: document.getElementById('userPhone').value,
                address: document.getElementById('userAddress').value,
                comment: document.getElementById('userComment').value
            };

            try {
                const res = await fetch('/api/order/create/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.success) {
                    document.getElementById('orderIdText').textContent = 'Номер заказа: #' + result.order_id;
                    document.getElementById('successModal').classList.add('show');
                } else {
                    alert('❌ ' + (result.error || 'Ошибка оформления заказа'));
                }
            } catch(e) {
                alert('❌ Ошибка: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Подтвердить заказ';
            }
        });

        // ========== ЗАКРЫТИЕ МОДАЛЬНОГО ОКНА ==========
        document.getElementById('successModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('show');
                window.location.href = '/shop/';
            }
        });

        // ========== ЗАГРУЗКА ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadCartSummary();
        });
    </script>
</body>
</html>
