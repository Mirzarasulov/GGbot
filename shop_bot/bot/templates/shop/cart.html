<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Корзина - Velosher Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-custom .brand {
            color: white;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }
        .navbar-custom .brand i { margin-right: 10px; }
        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 20px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.3);
            color: white;
        }
        .cart-item {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
        }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; font-size: 18px; color: #2d3436; }
        .cart-item-price { color: #667eea; font-weight: 700; font-size: 18px; }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cart-item-qty button {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
        }
        .cart-item-qty button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .cart-total {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: sticky;
            bottom: 0;
        }
        .total-price {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }
        .btn-checkout {
            background: linear-gradient(135deg, #00b894 0%, #00a381 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s;
        }
        .btn-checkout:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0,184,148,0.4);
            color: white;
        }
        .btn-clear {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-clear:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255,71,87,0.3);
            color: white;
        }
        .empty-cart {
            text-align: center;
            padding: 80px 20px;
            color: #b2bec3;
        }
        .empty-cart i { font-size: 64px; margin-bottom: 20px; }
        .footer {
            background: #2d3436;
            color: rgba(255,255,255,0.7);
            padding: 40px 0;
            margin-top: 40px;
            text-align: center;
        }
        @media (max-width: 768px) {
            .cart-item { flex-wrap: wrap; }
            .cart-item img { width: 60px; height: 60px; }
            .total-price { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar-custom">
        <div class="container">
            <div class="row w-100 align-items-center">
                <div class="col-6">
                    <a href="/shop/" class="brand"><i class="fas fa-bicycle"></i> Velosher</a>
                </div>
                <div class="col-6 text-end">
                    <a href="/shop/" class="btn-back"><i class="fas fa-arrow-left"></i> В магазин</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="container py-4">
        <h2 class="mb-4"><i class="fas fa-shopping-cart" style="color:#667eea;"></i> Моя корзина</h2>
        <div id="cartContainer">
            <div class="text-center py-5">
                <div class="loading-spinner"></div>
                <p class="mt-3 text-muted">Загрузка корзины...</p>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <div class="container">
            <p class="mb-0">© 2024 Velosher Shop</p>
        </div>
    </div>

    <style>
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        // ========== ЗАГРУЗКА КОРЗИНЫ ==========
        async function loadCart() {
            try {
                const res = await fetch('/api/cart/');
                const data = await res.json();
                renderCart(data);
            } catch(e) {
                document.getElementById('cartContainer').innerHTML = `
                    <div class="text-center py-5 text-danger">
                        <i class="fas fa-exclamation-triangle" style="font-size:48px;"></i>
                        <p class="mt-3">Ошибка загрузки корзины</p>
                    </div>
                `;
            }
        }

        function renderCart(data) {
            const container = document.getElementById('cartContainer');
            
            if (!data.items || data.items.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-bag"></i>
                        <h4>Корзина пуста</h4>
                        <p class="text-muted">Добавьте товары из магазина</p>
                        <a href="/shop/" class="btn btn-primary mt-3">Перейти в магазин</a>
                    </div>
                `;
                return;
            }

            let html = '';
            data.items.forEach(item => {
                html += `
                    <div class="cart-item">
                        <img src="${item.image || 'https://via.placeholder.com/80/667eea/white?text=🚲'}" alt="${item.name}">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${item.price_format || item.price} сум</div>
                        </div>
                        <div class="cart-item-qty">
                            <button onclick="updateQty(${item.id}, -1)">−</button>
                            <span style="font-weight:600; font-size:18px; min-width:30px; text-align:center;">${item.quantity}</span>
                            <button onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                        <div style="font-weight:700; font-size:18px; color:#2d3436; min-width:100px; text-align:right;">
                            ${item.subtotal_format || item.subtotal} сум
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="cart-total">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <span style="font-size:18px; color:#6c757d;">Итого:</span>
                            <span class="total-price">${data.total_format || data.total} сум</span>
                            <br>
                            <small class="text-muted">Товаров: ${data.count} шт.</small>
                        </div>
                        <div class="col-md-6 text-md-end mt-3 mt-md-0">
                            <button class="btn-clear me-2" onclick="clearCart()">
                                <i class="fas fa-trash"></i> Очистить
                            </button>
                            <a href="/checkout/" class="btn-checkout">
                                <i class="fas fa-check"></i> Оформить заказ
                            </a>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // ========== ОБНОВЛЕНИЕ КОЛИЧЕСТВА ==========
        async function updateQty(id, delta) {
            try {
                const res = await fetch('/api/cart/');
                const data = await res.json();
                const item = data.items.find(i => i.id === id);
                if (item) {
                    const newQty = item.quantity + delta;
                    await fetch('/api/cart/update/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ product_id: id, quantity: newQty })
                    });
                    loadCart();
                }
            } catch(e) {
                alert('Ошибка обновления');
            }
        }

        // ========== ОЧИСТКА КОРЗИНЫ ==========
        async function clearCart() {
            if (!confirm('Очистить корзину?')) return;
            try {
                await fetch('/api/cart/clear/', { method: 'POST' });
                loadCart();
            } catch(e) {
                alert('Ошибка очистки');
            }
        }

        // ========== ЗАГРУЗКА ==========
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
