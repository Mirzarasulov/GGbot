<!DOCTYPE html>
{% load static %}
<html lang="ru" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚲 Velosher - Магазин велосипедов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #6c757d;
            --shadow-color: rgba(0,0,0,0.08);
            --border-color: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-card: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --shadow-color: rgba(0,0,0,0.3);
            --border-color: #2a2a4e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-custom .brand {
            color: white;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }
        .navbar-custom .brand i { margin-right: 10px; }
        .cart-badge {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        .cart-badge:hover { background: rgba(255,255,255,0.3); color: white; }
        .cart-count {
            background: #ff4757;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 5px;
        }
        .theme-toggle {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
        }
        .product-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: all 0.4s ease;
            height: 100%;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(102,126,234,0.2);
        }
        .product-image-wrapper {
            position: relative;
            overflow: hidden;
        }
        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: var(--bg-primary);
            transition: transform 0.5s ease;
        }
        .product-card:hover .product-image {
            transform: scale(1.08);
        }
        .discount-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ff4757;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            z-index: 5;
            box-shadow: 0 4px 15px rgba(255,71,87,0.3);
        }
        .stock-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            z-index: 5;
        }
        .stock-badge.in-stock { background: rgba(0,184,148,0.9); color: white; }
        .stock-badge.out-stock { background: rgba(255,71,87,0.9); color: white; }
        .product-body { padding: 16px; }
        .product-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 6px;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }
        .product-old-price {
            text-decoration: line-through;
            color: var(--text-secondary);
            font-size: 14px;
            margin-left: 8px;
        }
        .filter-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px var(--shadow-color);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .filter-section .form-control,
        .filter-section .form-select {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }
        .filter-section .form-control:focus,
        .filter-section .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .filter-section .form-control::placeholder {
            color: var(--text-secondary);
        }
        .footer {
            background: #2d3436;
            color: rgba(255,255,255,0.7);
            padding: 40px 0;
            margin-top: 40px;
            text-align: center;
        }
        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2d3436;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 99999;
            animation: slideUp 0.5s ease;
            font-size: 15px;
        }
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102,126,234,0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text-muted-custom {
            color: var(--text-secondary);
        }
        @media (max-width: 768px) {
            .product-image { height: 180px; }
            .product-price { font-size: 17px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar-custom">
        <div class="container">
            <div class="row w-100 align-items-center">
                <div class="col-5">
                    <a href="/shop/" class="brand"><i class="fas fa-bicycle"></i> Velosher</a>
                </div>
                <div class="col-7 text-end">
                    <button class="theme-toggle me-2" onclick="toggleTheme()">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                    <a href="/cart/" class="cart-badge">
                        <i class="fas fa-shopping-cart"></i> Корзина
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="container py-4">

        <div class="filter-section">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <h5 class="mb-0" style="color:var(--text-primary);">
                        <i class="fas fa-filter" style="color:#667eea;"></i> Каталог
                    </h5>
                </div>
                <div class="col-md-4 mt-2 mt-md-0">
                    <input type="text" class="form-control" id="searchInput" placeholder="🔍 Поиск товаров..." onkeyup="filterProducts()">
                </div>
                <div class="col-md-4 mt-2 mt-md-0">
                    <select class="form-select" id="sortSelect" onchange="sortProducts()">
                        <option value="default">По умолчанию</option>
                        <option value="price_asc">Цена: по возрастанию</option>
                        <option value="price_desc">Цена: по убыванию</option>
                        <option value="name">По названию</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-4" id="productsContainer">
            <div class="col-12 text-center py-5">
                <div class="loading-spinner"></div>
                <p class="mt-3 text-muted-custom">Загрузка товаров...</p>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <div class="container">
            <p class="mb-0">© 2024 Velosher Shop</p>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" style="display:none;"></div>

    <script>
        let allProducts = [];

        // ========== ТЕМНАЯ ТЕМА ==========
        function toggleTheme() {
            const html = document.getElementById('htmlRoot');
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            const icon = document.getElementById('themeIcon');
            icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.getElementById('htmlRoot').setAttribute('data-theme', savedTheme);
        const icon = document.getElementById('themeIcon');
        icon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';

        // ========== ЗАГРУЗКА ТОВАРОВ ==========
        async function loadProducts() {
            try {
                const res = await fetch('/api/products/');
                const data = await res.json();
                if (data.products && data.products.length > 0) {
                    allProducts = data.products;
                    renderProducts(allProducts);
                } else {
                    document.getElementById('productsContainer').innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-box-open" style="font-size:48px; color:var(--text-secondary);"></i>
                            <p class="mt-3 text-muted-custom">Товаров пока нет</p>
                        </div>
                    `;
                }
            } catch (e) {
                document.getElementById('productsContainer').innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-exclamation-triangle" style="font-size:48px; color:#ff4757;"></i>
                        <p class="text-danger mt-3">⚠️ Ошибка загрузки</p>
                    </div>
                `;
            }
        }

        function renderProducts(products) {
            let html = '';
            products.forEach(p => {
                const discount = p.discount || 0;
                const inStock = p.stock > 0;
                html += `
                    <div class="col-md-3 col-6">
                        <div class="product-card" onclick="window.location.href='/shop/${p.id}/'">
                            <div class="product-image-wrapper">
                                ${discount > 0 ? `<span class="discount-badge">-${discount}%</span>` : ''}
                                <img src="${p.image || 'https://via.placeholder.com/300x220/667eea/white?text=🚲'}" 
                                     class="product-image" 
                                     alt="${p.name}"
                                     onerror="this.src='https://via.placeholder.com/300x220/667eea/white?text=🚲'">
                                <span class="stock-badge ${inStock ? 'in-stock' : 'out-stock'}">
                                    ${inStock ? '✅ В наличии' : '❌ Нет'}
                                </span>
                            </div>
                            <div class="product-body">
                                <div class="product-name">${p.name}</div>
                                <div>
                                    <span class="product-price">${p.price_format || p.price} сум</span>
                                    ${p.old_price ? `<span class="product-old-price">${p.old_price} сум</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('productsContainer').innerHTML = html;
            loadCartCount();
        }

        // ========== ФИЛЬТРАЦИЯ ==========
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.description && p.description.toLowerCase().includes(query))
            );
            renderProducts(filtered);
        }

        function sortProducts() {
            const sort = document.getElementById('sortSelect').value;
            let sorted = [...allProducts];
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (query) {
                sorted = sorted.filter(p => 
                    p.name.toLowerCase().includes(query) || 
                    (p.description && p.description.toLowerCase().includes(query))
                );
            }
            switch(sort) {
                case 'price_asc': sorted.sort((a, b) => a.price - b.price); break;
                case 'price_desc': sorted.sort((a, b) => b.price - a.price); break;
                case 'name': sorted.sort((a, b) => a.name.localeCompare(b.name)); break;
                default: break;
            }
            renderProducts(sorted);
        }

        // ========== СЧЕТЧИК КОРЗИНЫ ==========
        async function loadCartCount() {
            try {
                const res = await fetch('/api/cart/');
                const data = await res.json();
                document.getElementById('cartCount').textContent = data.count || 0;
            } catch(e) {
                document.getElementById('cartCount').textContent = 0;
            }
        }

        // ========== ЗАГРУЗКА ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
        });
    </script>
</body>
</html>
