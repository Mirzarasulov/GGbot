<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velosher Shop - Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .bg-animation {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #2a1a4e 100%);
        }
        .bg-animation::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(102,126,234,0.15) 0%, transparent 70%);
            top: -200px; right: -200px;
            animation: float 8s ease-in-out infinite;
        }
        .bg-animation::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(118,75,162,0.15) 0%, transparent 70%);
            bottom: -200px; left: -200px;
            animation: float 10s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }
        .glass {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.4s ease;
        }
        .glass:hover {
            transform: translateY(-5px);
            border-color: rgba(102,126,234,0.3);
            box-shadow: 0 20px 60px rgba(102,126,234,0.15);
        }
        .header-glass {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 20px 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-subtitle { color: rgba(255,255,255,0.5); font-size: 14px; }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.4s ease;
            cursor: pointer;
        }
        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(102,126,234,0.3);
            box-shadow: 0 15px 40px rgba(102,126,234,0.2);
        }
        .stat-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .stat-number {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-top: 5px; }
        .nav-tabs { border: none; gap: 8px; flex-wrap: wrap; }
        .nav-tabs .nav-link {
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px 22px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.03);
        }
        .nav-tabs .nav-link:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            transform: translateY(-2px);
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(102,126,234,0.3);
        }
        .badge-status {
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 12px;
            display: inline-block;
        }
        .badge-pending { background: rgba(255,193,7,0.2); color: #ffc107; }
        .badge-paid { background: rgba(40,167,69,0.2); color: #28a745; }
        .badge-shipped { background: rgba(23,162,184,0.2); color: #17a2b8; }
        .badge-delivered { background: rgba(0,123,255,0.2); color: #007bff; }
        .badge-cancelled { background: rgba(220,53,69,0.2); color: #dc3545; }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(102,126,234,0.4);
            color: #fff;
        }
        .btn-outline-glass {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            padding: 10px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 500;
            text-decoration: none;
        }
        .btn-outline-glass:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: translateY(-2px);
        }
        .btn-danger-glass {
            background: rgba(220,53,69,0.15);
            border: 1px solid rgba(220,53,69,0.2);
            color: #dc3545;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 13px;
        }
        .btn-danger-glass:hover {
            background: rgba(220,53,69,0.25);
            color: #ff6b7a;
        }
        .table-modern {
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255,255,255,0.03);
        }
        .table-modern thead {
            background: linear-gradient(135deg, rgba(102,126,234,0.2) 0%, rgba(118,75,162,0.2) 100%);
        }
        .table-modern thead th {
            color: #fff;
            font-weight: 600;
            padding: 15px;
            border: none;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-modern tbody td {
            color: rgba(255,255,255,0.85);
            padding: 15px;
            border-color: rgba(255,255,255,0.05);
            vertical-align: middle;
        }
        .table-modern tbody tr:hover { background: rgba(255,255,255,0.05); }
        .product-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-10px);
            border-color: rgba(102,126,234,0.3);
            box-shadow: 0 20px 50px rgba(102,126,234,0.15);
        }
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: rgba(255,255,255,0.03);
        }
        .product-card-body { padding: 16px; }
        .product-name { font-weight: 600; font-size: 16px; color: #fff; margin-bottom: 5px; }
        .product-price { color: #667eea; font-weight: 700; font-size: 20px; margin: 8px 0; }
        .product-stock { font-size: 13px; color: rgba(255,255,255,0.5); }
        .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: #fff;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.08);
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
            color: #fff;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .form-control[type="file"]::-webkit-file-upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 10px; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }
        @media (max-width: 768px) {
            .header-title { font-size: 20px; }
            .stat-number { font-size: 2rem; }
            .glass { padding: 15px; }
            .header-glass { padding: 15px; flex-direction: column; text-align: center; }
            .nav-tabs .nav-link { padding: 8px 14px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="container">
        <!-- HEADER -->
        <div class="header-glass">
            <div>
                <div class="header-title"><i class="fas fa-store"></i> Velosher Shop</div>
                <div class="header-subtitle"><i class="fas fa-phone-alt"></i> +998 90 123 45 67</div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a href="/admin/" class="btn-outline-glass"><i class="fas fa-cog"></i> Админка</a>
                <a href="/shop/" class="btn-outline-glass"><i class="fas fa-store"></i> Магазин</a>
                <a href="/api/export/orders/" class="btn-outline-glass"><i class="fas fa-download"></i> Экспорт</a>
                <button class="btn-outline-glass" onclick="location.reload()"><i class="fas fa-sync"></i> Обновить</button>
            </div>
        </div>

        <!-- TABS -->
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item"><button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard"><i class="fas fa-chart-pie"></i> Главная</button></li>
            <li class="nav-item"><button class="nav-link" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders"><i class="fas fa-box"></i> Заказы</button></li>
            <li class="nav-item"><button class="nav-link" id="products-tab" data-bs-toggle="tab" data-bs-target="#products"><i class="fas fa-tag"></i> Товары</button></li>
            <li class="nav-item"><button class="nav-link" id="users-tab" data-bs-toggle="tab" data-bs-target="#users"><i class="fas fa-users"></i> Пользователи</button></li>
            <li class="nav-item"><button class="nav-link" id="analytics-tab" data-bs-toggle="tab" data-bs-target="#analytics"><i class="fas fa-chart-line"></i> Аналитика</button></li>
        </ul>

        <!-- TAB CONTENT -->
        <div class="tab-content">
            <!-- DASHBOARD -->
            <div class="tab-pane fade show active" id="dashboard">
                <div class="row g-4" id="stats"></div>
                <div class="glass mt-4">
                    <h4 style="color:#fff; margin-bottom:20px;"><i class="fas fa-clock" style="color:#667eea;"></i> Последние заказы</h4>
                    <div id="ordersList"></div>
                </div>
            </div>

            <!-- ORDERS -->
            <div class="tab-pane fade" id="orders">
                <div class="glass"><h4 style="color:#fff; margin-bottom:20px;"><i class="fas fa-box" style="color:#667eea;"></i> Все заказы</h4><div id="allOrdersList"></div></div>
            </div>

            <!-- PRODUCTS -->
            <div class="tab-pane fade" id="products">
                <div class="glass">
                    <h4 style="color:#fff; margin-bottom:20px;"><i class="fas fa-plus-circle" style="color:#667eea;"></i> Добавить товар</h4>
                    <form id="addProductForm" enctype="multipart/form-data" class="row g-3">
                        <div class="col-md-4"><input type="text" class="form-control" id="pName" placeholder="Название" required></div>
                        <div class="col-md-3"><input type="number" class="form-control" id="pPrice" placeholder="Цена (сум)" required></div>
                        <div class="col-md-2"><input type="number" class="form-control" id="pStock" placeholder="Кол-во" value="10"></div>
                        <div class="col-md-3"><input type="file" class="form-control" id="pImage" accept="image/*"></div>
                        <div class="col-12"><textarea class="form-control" id="pDesc" placeholder="Описание" rows="2"></textarea></div>
                        <div class="col-12"><button type="submit" class="btn-gradient w-100"><i class="fas fa-plus"></i> Добавить товар</button></div>
                    </form>
                </div>
                <div class="glass mt-4">
                    <h4 style="color:#fff; margin-bottom:20px;"><i class="fas fa-list" style="color:#667eea;"></i> Список товаров</h4>
                    <div class="row g-4" id="productsList"></div>
                </div>
            </div>

            <!-- USERS -->
            <div class="tab-pane fade" id="users">
                <div class="glass">
                    <h4 style="color:#fff; margin-bottom:20px;"><i class="fas fa-users" style="color:#667eea;"></i> Все пользователи
                        <button class="btn btn-danger btn-sm float-end" onclick="deleteAllUsers()"><i class="fas fa-trash"></i> Удалить всех</button>
                    </h4>
                    <div id="usersList"></div>
                </div>
            </div>

            <!-- ANALYTICS -->
            <div class="tab-pane fade" id="analytics">
                <div class="glass"><h4 style="color:#fff; margin-bottom:20px;"><i class="fas fa-chart-bar" style="color:#667eea;"></i> Аналитика</h4><div id="analyticsData"></div></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========== ЗАГРУЗКА СТАТИСТИКИ ==========
        async function loadStats() {
            try {
                const res = await fetch('/api/stats/');
                const data = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="col-md-3 col-6"><div class="stat-card"><span class="stat-icon">👥</span><div class="stat-number">${data.users}</div><div class="stat-label">Пользователи</div></div></div>
                    <div class="col-md-3 col-6"><div class="stat-card"><span class="stat-icon">📦</span><div class="stat-number">${data.orders}</div><div class="stat-label">Всего заказов</div></div></div>
                    <div class="col-md-3 col-6"><div class="stat-card"><span class="stat-icon">💰</span><div class="stat-number">${data.revenue_format || data.revenue}</div><div class="stat-label">Выручка (сум)</div></div></div>
                    <div class="col-md-3 col-6"><div class="stat-card"><span class="stat-icon">📈</span><div class="stat-number">${data.todayOrders}</div><div class="stat-label">Заказов сегодня</div></div></div>
                `;
            } catch(e) { console.error(e); }
        }

        // ========== ЗАГРУЗКА ТОВАРОВ ==========
        async function loadProducts() {
            try {
                const res = await fetch('/api/products/');
                const data = await res.json();
                let html = '';
                if (data.products && data.products.length > 0) {
                    data.products.forEach(p => {
                        html += `<div class="col-md-3 col-6"><div class="product-card"><img src="${p.image}" class="product-image" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x300/1a1a3e/667eea?text=🚲'"><div class="product-card-body"><div class="product-name">${p.name}</div><div class="product-price">${p.price_format || p.price} сум</div><div class="product-stock">${p.in_stock ? '✅ В наличии: ' + p.stock + ' шт' : '❌ Нет в наличии'}</div><button class="btn-danger-glass mt-2 w-100" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i> Удалить</button></div></div></div>`;
                    });
                } else {
                    html = `<div class="col-12 text-center" style="color:rgba(255,255,255,0.3); padding:60px 0;"><i class="fas fa-box-open" style="font-size:48px;display:block;margin-bottom:15px;"></i>Товаров пока нет</div>`;
                }
                document.getElementById('productsList').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        // ========== ДОБАВЛЕНИЕ ТОВАРА ==========
        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('pName').value);
            formData.append('description', document.getElementById('pDesc').value);
            formData.append('price', document.getElementById('pPrice').value);
            formData.append('stock', document.getElementById('pStock').value);
            const image = document.getElementById('pImage').files[0];
            if (image) formData.append('image', image);
            try {
                const res = await fetch('/api/products/add/', { method: 'POST', body: formData });
                if (res.ok) { alert('✅ Товар добавлен!'); this.reset(); loadProducts(); }
                else { alert('❌ Ошибка добавления'); }
            } catch(e) { alert('❌ Ошибка'); }
        });

        // ========== УДАЛЕНИЕ ТОВАРА ==========
        async function deleteProduct(id) {
            if (!confirm('Удалить товар?')) return;
            try {
                const res = await fetch(`/api/products/${id}/delete/`, { method: 'DELETE' });
                if (res.ok) { alert('✅ Товар удален'); loadProducts(); }
            } catch(e) { alert('❌ Ошибка'); }
        }

        // ========== ЗАГРУЗКА ЗАКАЗОВ ==========
        async function loadOrders() {
            try {
                const res = await fetch('/api/orders/');
                const data = await res.json();
                let html = `<div class="table-responsive"><table class="table table-modern"><thead><tr><th>Заказ</th><th>Покупатель</th><th>Сумма</th><th>Статус</th><th>Дата</th></tr></thead><tbody>`;
                if (data.orders && data.orders.length > 0) {
                    data.orders.slice(0, 10).forEach(o => {
                        html += `<tr><td><strong style="color:#667eea;">#${o.order_id}</strong></td><td>${o.user_name || 'Неизвестно'}</td><td><strong>${o.total_format || o.total_amount} сум</strong></td><td><span class="badge-status badge-${o.status}">${o.status_display || o.status}</span></td><td style="color:rgba(255,255,255,0.5);">${o.created_at}</td></tr>`;
                    });
                } else {
                    html += `<tr><td colspan="5" class="text-center" style="color:rgba(255,255,255,0.3);">Нет заказов</td></tr>`;
                }
                html += '</tbody></table></div>';
                document.getElementById('ordersList').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        async function loadAllOrders() {
            try {
                const res = await fetch('/api/orders/');
                const data = await res.json();
                let html = `<div class="table-responsive"><table class="table table-modern"><thead><tr><th>Заказ</th><th>Покупатель</th><th>Телефон</th><th>Сумма</th><th>Статус</th><th>Дата</th></tr></thead><tbody>`;
                if (data.orders && data.orders.length > 0) {
                    data.orders.forEach(o => {
                        html += `<tr><td><strong style="color:#667eea;">#${o.order_id}</strong></td><td>${o.user_name || 'Неизвестно'}</td><td>${o.phone || '-'}</td><td><strong>${o.total_format || o.total_amount} сум</strong></td><td><span class="badge-status badge-${o.status}">${o.status_display || o.status}</span></td><td style="color:rgba(255,255,255,0.5);">${o.created_at}</td></tr>`;
                    });
                } else {
                    html += `<tr><td colspan="6" class="text-center" style="color:rgba(255,255,255,0.3);">Нет заказов</td></tr>`;
                }
                html += '</tbody></table></div>';
                document.getElementById('allOrdersList').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        // ========== ЗАГРУЗКА ПОЛЬЗОВАТЕЛЕЙ ==========
        async function loadUsers() {
            try {
                const res = await fetch('/api/users/');
                const data = await res.json();
                let html = `<div class="table-responsive"><table class="table table-modern"><thead><tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Заказов</th><th>Потрачено</th><th>Дата</th><th>Действие</th></tr></thead><tbody>`;
                if (data.users && data.users.length > 0) {
                    data.users.forEach(u => {
                        html += `<tr><td><strong>${u.telegram_id}</strong></td><td>${u.first_name} ${u.username ? '@'+u.username : ''}</td><td>${u.phone || '-'}</td><td>${u.total_orders}</td><td style="color:#667eea;font-weight:600;">${u.total_spent_format || u.total_spent} сум</td><td style="color:rgba(255,255,255,0.5);">${u.created_at}</td><td><button class="btn-danger-glass" onclick="deleteUser(${u.id})"><i class="fas fa-trash"></i></button></td></tr>`;
                    });
                } else {
                    html += `<tr><td colspan="7" class="text-center" style="color:rgba(255,255,255,0.3);">Нет пользователей</td></tr>`;
                }
                html += '</tbody></table></div>';
                document.getElementById('usersList').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        async function deleteUser(id) {
            if (!confirm('Удалить пользователя?')) return;
            try {
                const res = await fetch(`/api/users/${id}/delete/`, { method: 'DELETE' });
                if (res.ok) { alert('✅ Пользователь удален'); loadUsers(); }
            } catch(e) { alert('❌ Ошибка'); }
        }

        async function deleteAllUsers() {
            if (!confirm('Удалить ВСЕХ пользователей?')) return;
            try {
                const res = await fetch('/api/users/delete-all/', { method: 'DELETE' });
                const data = await res.json();
                alert(`✅ Удалено ${data.deleted} пользователей`);
                loadUsers();
            } catch(e) { alert('❌ Ошибка'); }
        }

        // ========== ЗАГРУЗКА АНАЛИТИКИ ==========
        async function loadAnalytics() {
            try {
                const res = await fetch('/api/analytics/');
                const data = await res.json();
                let html = `
                    <div class="row g-3 mb-4">
                        <div class="col-md-3 col-6"><div class="stat-card"><span class="stat-icon">👥</span><div class="stat-number">${data.totalUsers}</div><div class="stat-label">Пользователей</div></div></div>
                        <div class="col-md-3 col-6"><div class="stat-card"><span class="stat-icon">📦</span><div class="stat-number">${data.totalOrders}</div><div class="stat-label">Заказов</div></div></div>
                        <div class="col-md-3 col-6"><div class="stat-card"><span class="stat-icon">💰</span><div class="stat-number">${data.totalRevenueFormat || data.totalRevenue}</div><div class="stat-label">Выручка (сум)</div></div></div>
                        <div class="col-md-3 col-6"><div class="stat-card"><span class="stat-icon">📊</span><div class="stat-number">${data.avgOrder ? Math.round(data.avgOrder) : 0}</div><div class="stat-label">Средний чек</div></div></div>
                    </div>
                    <h5 style="color:#fff; margin-bottom:15px;">📈 Статистика за 30 дней</h5>
                    <div class="table-responsive">
                        <table class="table table-modern">
                            <thead><tr><th>Дата</th><th>Заказы</th><th>Выручка</th></tr></thead>
                            <tbody>${data.dailyStats ? data.dailyStats.slice(-7).map(d => `<tr><td>${d.date}</td><td>${d.orders}</td><td style="color:#667eea;font-weight:600;">${d.revenue} сум</td></tr>`).join('') : '<tr><td colspan="3" style="color:rgba(255,255,255,0.3);">Нет данных</td></tr>'}</tbody>
                        </table>
                    </div>
                    ${data.topProducts && data.topProducts.length > 0 ? `
                        <h5 style="color:#fff; margin-top:20px;">🏆 Популярные товары</h5>
                        <div class="table-responsive">
                            <table class="table table-modern">
                                <thead><tr><th>Товар</th><th>Продано</th></tr></thead>
                                <tbody>${data.topProducts.map(p => `<tr><td>${p.name}</td><td>${p.order_count} шт</td></tr>`).join('')}</tbody>
                            </table>
                        </div>
                    ` : ''}
                `;
                document.getElementById('analyticsData').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        // ========== ЗАГРУЗКА ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadStats(); loadOrders(); loadProducts(); loadUsers(); loadAnalytics(); loadAllOrders();
            document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(btn => {
                btn.addEventListener('shown.bs.tab', function(e) {
                    const target = e.target.getAttribute('data-bs-target');
                    if (target === '#orders') loadAllOrders();
                    if (target === '#products') loadProducts();
                    if (target === '#users') loadUsers();
                    if (target === '#analytics') loadAnalytics();
                    if (target === '#dashboard') { loadStats(); loadOrders(); }
                });
            });
            setInterval(() => { loadStats(); loadOrders(); }, 30000);
        });
    </script>
</body>
</html>
