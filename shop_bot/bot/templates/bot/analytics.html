<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Аналитика</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .analytics-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .analytics-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
        }
        
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .chart-card h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="analytics-container">
        <div class="analytics-header">
            <h1>📊 Аналитика магазина</h1>
            <p>Статистика продаж, пользователей и товаров</p>
        </div>
        
        <div class="chart-grid">
            <div class="chart-card">
                <h3>📈 Продажи за последние 7 дней</h3>
                <div class="chart-container">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>
            
            <div class="chart-card">
                <h3>🏆 Топ-5 товаров</h3>
                <div class="chart-container">
                    <canvas id="topProductsChart"></canvas>
                </div>
            </div>
            
            <div class="chart-card">
                <h3>👥 Новые пользователи</h3>
                <div class="chart-container">
                    <canvas id="usersChart"></canvas>
                </div>
            </div>
            
            <div class="chart-card">
                <h3>📊 Статусы заказов</h3>
                <div class="chart-container">
                    <canvas id="orderStatusChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Загрузка данных для графиков
        async function loadCharts() {
            try {
                // Загрузка данных продаж
                const salesResponse = await fetch('/api/analytics/sales/');
                const salesData = await salesResponse.json();
                
                // График продаж
                new Chart(document.getElementById('salesChart'), {
                    type: 'line',
                    data: {
                        labels: salesData.dates,
                        datasets: [{
                            label: 'Продажи, ₽',
                            data: salesData.values,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
                
                // Топ-товары
                const topProductsResponse = await fetch('/api/analytics/top-products/');
                const topProducts = await topProductsResponse.json();
                
                new Chart(document.getElementById('topProductsChart'), {
                    type: 'bar',
                    data: {
                        labels: topProducts.map(p => p.name),
                        datasets: [{
                            label: 'Количество продаж',
                            data: topProducts.map(p => p.sales),
                            backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1
                                }
                            }
                        }
                    }
                });
                
                // Новые пользователи
                const usersResponse = await fetch('/api/analytics/new-users/');
                const usersData = await usersResponse.json();
                
                new Chart(document.getElementById('usersChart'), {
                    type: 'bar',
                    data: {
                        labels: usersData.dates,
                        datasets: [{
                            label: 'Новые пользователи',
                            data: usersData.values,
                            backgroundColor: 'rgba(102, 126, 234, 0.6)',
                            borderColor: '#667eea',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1
                                }
                            }
                        }
                    }
                });
                
                // Статусы заказов
                const statusResponse = await fetch('/api/analytics/order-status/');
                const statusData = await statusResponse.json();
                
                new Chart(document.getElementById('orderStatusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: statusData.labels,
                        datasets: [{
                            data: statusData.values,
                            backgroundColor: ['#ffd93d', '#6bcb77', '#4d96ff', '#ff6b6b']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
                
            } catch (error) {
                console.error('Error loading charts:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadCharts);
    </script>
</body>
</html>
