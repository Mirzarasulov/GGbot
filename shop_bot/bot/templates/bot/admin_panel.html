<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Панель администратора</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
        }
        
        .admin-header h1 {
            font-size: 32px;
        }
        
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-card .label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .admin-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        .admin-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .admin-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        
        .order-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        
        .order-item:last-child {
            border-bottom: none;
        }
        
        .order-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-new { background: #ffd93d; color: #333; }
        .status-paid { background: #6bcb77; color: white; }
        .status-completed { background: #4d96ff; color: white; }
        .status-cancelled { background: #ff6b6b; color: white; }
        
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-success {
            background: #6bcb77;
            color: white;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .product-form {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .product-form input,
        .product-form textarea,
        .product-form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .product-form textarea {
            height: 80px;
            resize: vertical;
        }
        
        .product-list {
            margin-top: 20px;
        }
        
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>👑 Панель управления магазином</h1>
            <p>Управление заказами, товарами и аналитикой</p>
        </div>
        
        <div class="admin-stats" id="stats">
            <!-- Статистика загружается через JavaScript -->
        </div>
        
        <div class="admin-grid">
            <div>
                <div class="admin-section">
                    <h2>📦 Последние заказы</h2>
                    <div id="recentOrders">
                        <!-- Заказы загружаются через JavaScript -->
                    </div>
                </div>
            </div>
            
            <div>
                <div class="admin-section">
                    <h2>📊 Топ-покупатели</h2>
                    <div id="topUsers">
                        <!-- Топ-покупатели загружаются через JavaScript -->
                    </div>
                </div>
                
                <div class="admin-section" style="margin-top:20px;">
                    <h2>🛍️ Добавить товар</h2>
                    <form id="addProductForm" onsubmit="addProduct(event)">
                        <input type="text" placeholder="Название товара" id="productName" required>
                        <textarea placeholder="Описание" id="productDescription" required></textarea>
                        <input type="number" placeholder="Цена" id="productPrice" required>
                        <input type="number" placeholder="Количество" id="productStock" required>
                        <input type="text" placeholder="URL изображения" id="productImage">
                        <button type="submit" class="btn btn-primary">➕ Добавить товар</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="admin-section" style="margin-top:20px;">
            <h2>🛍️ Все товары</h2>
            <div id="allProducts">
                <!-- Товары загружаются через JavaScript -->
            </div>
        </div>
    </div>
    
    <script>
        // Загрузка данных
        async function loadDashboard() {
            try {
                // Загрузка статистики
                const statsResponse = await fetch('/api/admin/stats/');
                const stats = await statsResponse.json();
                
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="number">${stats.total_orders}</div>
                        <div class="label">Всего заказов</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.total_users}</div>
                        <div class="label">Пользователей</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.total_revenue}₽</div>
                        <div class="label">Выручка</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.new_orders}</div>
                        <div class="label">Новых заказов</div>
                    </div>
                `;
                
                // Загрузка заказов
                const ordersResponse = await fetch('/api/admin/orders/');
                const orders = await ordersResponse.json();
                
                document.getElementById('recentOrders').innerHTML = orders.map(order => `
                    <div class="order-item">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div>
                                <strong>Заказ #${order.id}</strong>
                                <span class="order-status status-${order.status}">${order.status_label}</span>
                            </div>
                            <div>${order.total_price}₽</div>
                        </div>
                        <div style="font-size:14px;color:#666;margin-top:5px;">
                            ${order.username || order.first_name || 'Аноним'} • ${order.phone}
                        </div>
                        <div style="margin-top:10px;">
                            <button class="btn btn-success" onclick="updateOrder(${order.id}, 'paid')">✅ Подтвердить</button>
                            <button class="btn btn-danger" onclick="updateOrder(${order.id}, 'cancelled')">❌ Отменить</button>
                        </div>
                    </div>
                `).join('');
                
                // Загрузка топ-покупателей
                const usersResponse = await fetch('/api/admin/top-users/');
                const users = await usersResponse.json();
                
                document.getElementById('topUsers').innerHTML = users.map((user, index) => `
                    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;">
                        <div>
                            ${index + 1}. ${user.username || user.first_name || 'Аноним'}
                        </div>
                        <div>
                            ${user.total_orders} заказов • ${user.total_spent}₽
                        </div>
                    </div>
                `).join('');
                
                // Загрузка товаров
                const productsResponse = await fetch('/api/products/');
                const products = await productsResponse.json();
                
                document.getElementById('allProducts').innerHTML = products.map(product => `
                    <div class="product-item">
                        <div>
                            <strong>${product.name}</strong>
                            <span style="color:#666;margin-left:10px;">${product.price}₽</span>
                            <span style="color:#666;margin-left:10px;">В наличии: ${product.stock}</span>
                        </div>
                        <div>
                            <button class="btn btn-danger" onclick="deleteProduct(${product.id})">🗑️ Удалить</button>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        
        async function addProduct(event) {
            event.preventDefault();
            
            const formData = new FormData();
            formData.append('name', document.getElementById('productName').value);
            formData.append('description', document.getElementById('productDescription').value);
            formData.append('price', document.getElementById('productPrice').value);
            formData.append('stock', document.getElementById('productStock').value);
            formData.append('image', document.getElementById('productImage').value);
            
            try {
                const response = await fetch('/api/admin/products/', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    alert('✅ Товар добавлен!');
                    document.getElementById('addProductForm').reset();
                    loadDashboard();
                } else {
                    alert('❌ Ошибка при добавлении товара');
                }
            } catch (error) {
                console.error('Error adding product:', error);
            }
        }
        
        async function updateOrder(orderId, status) {
            try {
                const response = await fetch(`/api/admin/orders/${orderId}/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ status })
                });
                
                if (response.ok) {
                    loadDashboard();
                }
            } catch (error) {
                console.error('Error updating order:', error);
            }
        }
        
        async function deleteProduct(productId) {
            if (!confirm('Удалить товар?')) return;
            
            try {
                const response = await fetch(`/api/admin/products/${productId}/`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadDashboard();
                }
            } catch (error) {
                console.error('Error deleting product:', error);
            }
        }
        
        // Загрузка при открытии страницы
        document.addEventListener('DOMContentLoaded', loadDashboard);
        
        // Обновление каждые 30 секунд
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
